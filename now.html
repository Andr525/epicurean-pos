<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Updating Epicurean POS</title>
<style>
  html,body{height:100%;margin:0;background:#0f0f14;color:#f1f5f9;font-family:-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;}
  p{opacity:.8;}
</style>
</head>
<body>
<p>Updating POS…</p>
<script>
(function(){
  var dest = './index.html?b=15&t=' + Date.now();
  function go(){ location.replace(dest); }
  var jobs = [];
  if (navigator.serviceWorker) {
    jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){ return r.unregister(); }));
    }));
  }
  if (window.caches) {
    jobs.push(caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){ return caches.delete(k); }));
    }));
  }
  Promise.all(jobs).then(go).catch(go);
  setTimeout(go, 1200);
})();
</script>
</body>
</html>
